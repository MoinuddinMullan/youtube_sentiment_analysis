# frontend/netlify.toml — Netlify deployment config for Sentiview AI frontend

[build]
  command = "npm run build"
  publish = "dist"

# ── CRITICAL: SPA (Single Page Application) routing fix ─────────────────────
# Without this rule, any URL other than "/" returns 404 because those paths
# don't exist as real files on Netlify's CDN. This rule tells Netlify to
# serve index.html for every request and let React Router handle the URL.
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# ── Cache static assets aggressively ─────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
